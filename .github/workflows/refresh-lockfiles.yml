name: Refresh lockfiles

on:
  push:
    branches: [feat/bump-deps-latest]
    paths:
      - "**/pyproject.toml"
      - "**/package.json"
      - "config/dependency-catalog.yaml"
      - ".github/workflows/refresh-lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: refresh-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Upgrade Python lockfile
        run: uv lock --upgrade

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh pnpm lockfiles
        run: |
          set -euo pipefail
          for dir in sdks/typescript apps/docs apps/web; do
            echo "==> $dir"
            (cd "$dir" && pnpm install --lockfile-only --no-frozen-lockfile)
          done

      - name: Commit lockfiles
        env:
          GIT_AUTHOR_NAME: Ajay-Satish-01
          GIT_AUTHOR_EMAIL: 71289526+Ajay-Satish-01@users.noreply.github.com
          GIT_COMMITTER_NAME: Ajay-Satish-01
          GIT_COMMITTER_EMAIL: 71289526+Ajay-Satish-01@users.noreply.github.com
        run: |
          set -euo pipefail
          git add uv.lock sdks/typescript/pnpm-lock.yaml apps/docs/pnpm-lock.yaml apps/web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit --no-verify -m "$(cat <<'EOF'
          chore: refresh uv and pnpm lockfiles

          Regenerated lockfiles against the latest resolved versions.
          EOF
          )"
          git push
