[project]
name = "seal-sql"
version = "0.1.0"
description = "SQL validation and execution for Seal"
requires-python = ">=3.11"
dependencies = [
    "seal-core",
    "pydantic>=2.13.5",
    "sqlglot[c]>=30.19.0",
    "asyncpg>=0.31.0",
    "duckdb>=1.5.5",
    "polars>=1.44.2",
]

[tool.uv.sources]
seal-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pandas>=3.0.6",
]
