# Shared third-party dependency versions for the Seal monorepo.
#
# Bump versions here only — then run:
#   make verify-dependency-catalog        # check alignment
#   uv lock                               # Python lock refresh
#   cd apps/docs && pnpm install          # JS lockfile refresh (repeat for apps/web)
#
# Notes:
#   - SDK (sdks/typescript) uses React 18 peer dep intentionally — wider range
#     for library consumers. Its dev deps are NOT cataloged here.
#   - Root pyproject.toml constraint-dependencies must mirror python.constraints.

# ─── JavaScript ────────────────────────────────────────────────────────────────

javascript:
  # Vega visualization stack
  vega: "^6.4.0"
  vega-lite: "^6.4.3"
  vega-embed: "^7.3.0"

  # Next.js framework
  next: "16.3.6"
  react: "19.3.0"
  react-dom: "19.3.0"

  # Shared UI libraries
  "@base-ui/react": "^1.8.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  framer-motion: "^13.4.3"
  lucide-react: "^1.48.0"
  next-themes: "^0.4.6"
  shadcn: "^4.21.0"
  tailwind-merge: "^3.7.0"
  tw-animate-css: "^1.4.0"

  # Dev tooling (shared between apps)
  "@tailwindcss/postcss": "^4.3.3"
  "@tailwindcss/typography": "^0.5.20"
  "@types/node": "^24"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  eslint: "^9.39.5"
  eslint-config-next: "16.3.6"
  prettier: "^3.9.9"
  prettier-plugin-tailwindcss: "^0.8.1"
  tailwindcss: "^4.3.3"
  typescript: "^5.9.3"

  packages:
    apps/docs:
      dependencies:
        - vega
        - vega-lite
        - vega-embed
        - next
        - react
        - react-dom
        - "@base-ui/react"
        - class-variance-authority
        - clsx
        - framer-motion
        - lucide-react
        - next-themes
        - shadcn
        - tailwind-merge
        - tw-animate-css
      devDependencies:
        - "@tailwindcss/postcss"
        - "@tailwindcss/typography"
        - "@types/node"
        - "@types/react"
        - "@types/react-dom"
        - eslint
        - eslint-config-next
        - prettier
        - prettier-plugin-tailwindcss
        - tailwindcss
        - typescript

    apps/web:
      dependencies:
        - vega
        - vega-lite
        - vega-embed
        - next
        - react
        - react-dom
        - "@base-ui/react"
        - class-variance-authority
        - clsx
        - framer-motion
        - lucide-react
        - next-themes
        - shadcn
        - tailwind-merge
        - tw-animate-css
      devDependencies:
        - "@tailwindcss/postcss"
        - "@tailwindcss/typography"
        - "@types/node"
        - "@types/react"
        - "@types/react-dom"
        - eslint
        - eslint-config-next
        - prettier
        - prettier-plugin-tailwindcss
        - tailwindcss
        - typescript

    sdks/typescript:
      peerDependencies:
        - vega
        - vega-lite
        - vega-embed

# ─── Python ────────────────────────────────────────────────────────────────────

python:
  # Root pyproject.toml [tool.uv].constraint-dependencies
  constraints:
    litellm: ">=1.102.1,<2"

  # Canonical versions for shared deps
  pydantic: ">=2.13.5"
  pydantic-settings: ">=2.15.0"
  asyncpg: ">=0.31.0"
  duckdb: ">=1.5.5"
  pyyaml: ">=6.0.3"
  instructor: ">=1.17.0"
  httpx: ">=0.28.1"
  polars: ">=1.44.2"
  pandas: ">=3.0.6"
  ruff: ">=0.16.8"
  pytest: ">=9.1.1"
  pytest-asyncio: ">=1.4.0"

  packages:
    packages/core:
      dependencies:
        - pydantic
        - pydantic-settings
        - asyncpg
        - duckdb
        - pyyaml
        - instructor
        - litellm
      dev:
        - pytest
        - pytest-asyncio
      chromadb_linux_extra: ">=0.6,<0.7"

    packages/sql:
      dependencies:
        - pydantic
        - asyncpg
        - duckdb
        - polars
      dev:
        - pytest
        - pytest-asyncio
        - pandas

    packages/charts:
      dependencies:
        - pydantic
      dev:
        - pytest

    packages/semantic:
      dependencies:
        - pydantic
        - pyyaml
      dev:
        - pytest

    apps/api:
      dependencies:
        - pydantic
      dev:
        - pytest
        - pytest-asyncio
        - ruff
        - httpx

    sdks/python:
      dependencies:
        - pydantic
        - httpx
      dev:
        - pytest
        - pytest-asyncio
      polars_optional: ">=1.44.2"
      pandas_optional: ">=3.0.6"

    evals:
      dev:
        - pytest
